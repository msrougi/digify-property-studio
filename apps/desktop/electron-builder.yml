appId: com.digify.propertystudio
productName: Digify Property Studio
executableName: digify-property-studio
# App standalone, sem auto-update/publish (não há repositório/servidor de
# releases configurado) — sem isso, o electron-builder tenta gerar metadados
# de auto-update e falha por falta de config de `repository`/`publish`.
publish: null
directories:
  output: dist-installer
  buildResources: build

files:
  - out/**/*
  - package.json
  # Precisa ser explícito: sem isso, o electron-builder aplica sua poda
  # "inteligente" padrão em node_modules — que removeu incorretamente o
  # binário nativo `onnxruntime-node/bin/napi-v6/darwin/x64/*.node` (a
  # variante certa pro pacote de Mac Intel!) tanto do pacote x64 quanto do
  # arm64, causando `Cannot find module '...onnxruntime_binding.node'` ao
  # abrir o app de verdade. Com o padrão explícito, o electron-builder usa
  # correspondência simples de glob em vez da poda por heurística — inclui
  # tudo, sem tentar "adivinhar" o que cada pacote precisa por plataforma.
  - node_modules/**/*

# asar desabilitado de propósito: os binários reais (ffmpeg-static/
# ffprobe-static, executados via child_process) e os módulos nativos
# (better-sqlite3/onnxruntime-node, .node) não podem ser abertos/executados
# de dentro de um app.asar de forma confiável — `asarUnpack` deveria
# resolver isso via redirecionamento transparente do Electron, mas na
# prática causou `ENOTDIR` ao tentar spawnar o ffprobe (o path calculado
# pelo pacote ffprobe-static aponta pro app.asar, não pro
# app.asar.unpacked). Sem asar, tudo fica em arquivos reais no disco — mais
# simples e mais robusto que depurar a fundo o redirecionamento do Electron
# pra esse caso. Ver docs/PACKAGING.md.
asar: false

# Modelos ONNX (~220MB no total) não versionados no git (acima do limite de
# 100MB do GitHub por arquivo — ver tools/*/README.md) — o instalador os
# empacota de qualquer forma, lendo direto do disco no momento do build.
extraResources:
  - from: models
    to: models

linux:
  target:
    - AppImage
  category: AudioVideo
  maintainer: Digify Property Studio

# mac: só o alvo "zip" é gerável a partir de Linux — DMG precisa de `sips`
# (ferramenta exclusiva do macOS) pra gerar o ícone/volume, falha com
# `sips process failed ENOENT` neste ambiente. Sem assinatura de código
# (precisa rodar num Mac de verdade com certificado Apple Developer) —
# usuário precisa liberar no Gatekeeper (clique direito → Abrir, ou System
# Settings → Privacy & Security → "Open Anyway"). Ver docs/PACKAGING.md.
#
# Só o arch `x64` aqui de propósito: `scripts/fix-native-abi.mjs` corrige o
# binário nativo do better-sqlite3 pra UMA arquitetura por vez (a da máquina
# que está rodando o build agora) — gerar x64+arm64 no mesmo run empacotaria
# a arquitetura que não bate com o host com um binário nativo inválido (bug
# real encontrado num Mac Intel de verdade, ver "Sétimo problema real" em
# docs/PACKAGING.md). Quem builda num Mac Apple Silicon deve trocar esse
# valor pra `arm64` antes de rodar `pnpm build:installer`.
mac:
  target:
    - target: zip
      arch:
        - x64
  category: public.app-category.video
  # Mitigação pro crash real EXC_BAD_INSTRUCTION dentro de
  # `-[NSPersistentUIManager flushAllChanges]` (achado rodando de verdade
  # num Mac Intel, macOS Ventura, ~350s depois do Mac acordar do sleep) —
  # ver "Sexto problema real" em docs/PACKAGING.md. `NSQuitAlwaysKeepsWindows:
  # false` diz ao macOS pra nunca persistir estado de janela pra esse app,
  # evitando o caminho de código que crasha. Electron não expõe controle
  # disso via API JS (não existe `app.applicationSupportsSecureRestorableState`
  # nas typings da versão instalada) — só dá pra ajustar via Info.plist.
  extendInfo:
    NSQuitAlwaysKeepsWindows: false

# win: NSIS precisa de `wine` funcional pra cross-compilar de Linux — neste
# ambiente, mesmo com wine64 instalado, o passo final falha
# (`wine: could not exec the wine loader`, precisa de um WINEPREFIX
# inicializado/suporte 32-bit que não foi configurado). Mantido aqui pra
# quando rodar num CI/máquina com wine de verdade configurado (ou nativo no
# Windows) — nesse caso, gera um instalador de verdade em vez do fallback
# portátil (zip do diretório `win-unpacked`) usado neste ambiente. Ver
# docs/PACKAGING.md.
win:
  target:
    - target: nsis
      arch:
        - x64

# O rebuild automático do electron-builder (via @electron/rebuild) para
# better-sqlite3 baixa o prebuild ERRADO neste ambiente (ABI do Node em vez
# do Electron, mesmo bug real já visto em `rebuild:electron` — ver
# docs/PACKAGING.md). Desligado aqui; `build:installer` faz o fix manual
# certo (prebuild-install --runtime=electron) antes de chamar electron-builder.
npmRebuild: false
